; Quest IDs in Journal - English configuration example
; Place next to questidsinjournal.dll at Data/SKSE/Plugins/questidsinjournal.ini
; Settings and hotkeys can also be changed in-game from the SkyUI MCM.
; IMPORTANT: Preserve the values in your existing INI when upgrading.

[Display]
ShowEditorID=1
ShowFormID=1
ShowStage=1
PositionX=505
PositionY=0
FontSize=13

[Hotkeys]
; All shortcuts require Ctrl + Shift + [letter or digit].
; Keep the 12 primary keys unique. EnableCopy=0 disables clipboard actions.
EnableCopy=1
EditorKey=C
FormKey=F
InspectorToggleKey=I
InspectorNextKey=N
InspectorPrevKey=P
; Select the next/previous stage in the inspector (does NOT change quest progress).
InspectorSelectNextKey=J
InspectorSelectPrevKey=K
; Toggle between stage list and selected stage details (read-only).
InspectorDetailsKey=D
; Copy a stage number or a setstage console command to the clipboard.
; Neither shortcut executes the command.
InspectorCopyStageKey=S
InspectorCopyCommandKey=G
; Execution requires two different shortcuts: request, then confirm.
InspectorRequestExecutionKey=V
InspectorConfirmExecutionKey=R

[Execution]
; SAFETY: 0 = disabled; 1 = allow requesting and confirming stage execution.
; Use a separate manual test save. Stage execution can permanently change quests.
EnableStageExecution=1

[Inspector]
; Coordinates are local to the journal page, not screen pixels.
PositionX=250
PositionY=150
Width=500
Height=330
FontSize=15
; 1 = reduce unused space on short pages; 0 = fixed panel Height.
CompactPages=1
